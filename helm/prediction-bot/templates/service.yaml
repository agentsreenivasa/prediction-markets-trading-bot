apiVersion: v1
kind: Service
metadata:
  name: {{ include "prediction-bot.fullname" . }}
  labels:
    {{- include "prediction-bot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: health
  selector:
    {{- include "prediction-bot.selectorLabels" . | nindent 4 }}
